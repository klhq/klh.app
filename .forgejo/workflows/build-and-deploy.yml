name: Build and Deploy klh-app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: workhorse
    steps:
      - name: Verify required secrets are set
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          REGISTRY_PUSH_TOKEN: ${{ secrets.REGISTRY_PUSH_TOKEN }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
        run: |
          missing=""
          [ -z "$GH_PAT" ] && missing="$missing GH_PAT"
          [ -z "$REGISTRY_PUSH_TOKEN" ] && missing="$missing REGISTRY_PUSH_TOKEN"
          [ -z "$KOMODO_API_KEY" ] && missing="$missing KOMODO_API_KEY"
          [ -z "$KOMODO_API_SECRET" ] && missing="$missing KOMODO_API_SECRET"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repo secret(s):$missing — see infra/docs/komodo-api-reference.md #2 for the onboarding checklist." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch remote content
        env:
          CONTENT_REPO: 'klhq/klh-content'
          CONTENT_GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Fetch latest content into src/content before docker build
          if command -v bun >/dev/null 2>&1; then
            bun install --frozen-lockfile
            bun run fetch:content
          fi

      - name: Check and build klh-app
        id: check-build
        run: |
          SHA=$(git log -1 --abbrev=7 --format="%h")
          echo "Building klh-app for commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

          export DOCKER_CONFIG="$(mktemp -d)"
          echo "${{ secrets.REGISTRY_PUSH_TOKEN }}" | docker login git.home -u klhq --password-stdin

          docker build \
            -t git.home/klhq/klh-app:latest \
            -t git.home/klhq/klh-app:$SHA \
            .

          docker push git.home/klhq/klh-app:latest
          docker push git.home/klhq/klh-app:$SHA
          docker logout git.home
          echo "build_run=true" >> "$GITHUB_OUTPUT"

      - name: Trigger Komodo Stack Deploy
        if: steps.check-build.outputs.build_run == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          curl -sf -X POST http://100.118.129.82:9120/execute \
            -H "X-Api-Key: ${{ secrets.KOMODO_API_KEY }}" \
            -H "X-Api-Secret: ${{ secrets.KOMODO_API_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"type": "DeployStack", "params": {"stack": "klh-app"}}'
